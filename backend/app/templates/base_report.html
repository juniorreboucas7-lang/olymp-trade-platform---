<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: sans-serif; color: #333; }
        .header { text-align: center; border-bottom: 2px solid #004d00; padding-bottom: 10px; margin-bottom: 20px; }
        .logo { color: #004d00; font-size: 24px; font-weight: bold; }
        .sub-logo { color: #d4af37; font-size: 14px; }
        .content { margin-bottom: 50px; }
        .footer {
            position: fixed;
            bottom: 0;
            width: 100%;
            text-align: center;
            font-size: 10px;
            border-top: 1px solid #ccc;
            padding-top: 5px;
            color: #666;
        }
        .title { text-align: center; font-size: 18px; font-weight: bold; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">2F Consultoria</div>
        <div class="sub-logo">Agrícola, Ambiental & Agrimensura</div>
    </div>

    <div class="title">{{ title }}</div>

    <div class="content">
        <p><strong>Cliente:</strong> {{ client_name }}</p>
        <p><strong>Data:</strong> {{ date }}</p>

        <div class="body-text">
            {{ body_content | safe }}
        </div>
    </div>

    <div class="footer">
        Francisco Rebouças Junior – Téc. em Agrimensura, Meio Ambiente e Agricultura – CFT 00348436203 – (93) 99185-3915
    </div>
</body>
</html>
